<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>250mesh Guardian</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HK2ZMH65Q0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HK2ZMH65Q0');
  </script>
  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <!-- Turf.js -->
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <style>
    html, body { height:100%; margin:0; padding:0; }
    #map { position:absolute; top:0; bottom:0; width:100%; }
    #topPanel {
      position:absolute; top:10px; left:10px; z-index:10;
      background:rgba(255,255,255,0.9); padding:10px; border-radius:5px;
      font-family:sans-serif;
    }
    #topPanel button { margin:5px 5px 0 0; }
    #title { font-weight:bold; font-size:18px; margin-bottom:5px; }
    #instruction { font-size:14px; color:#333; margin-bottom:5px; }
    #remaining { margin-top:5px; font-weight:bold; color:#333; }
    #sharePopup {
      display:none; position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%); background:white; padding:20px;
      border:2px solid #ccc; z-index:1000; box-shadow:0 4px 10px rgba(0,0,0,0.3);
    }
    #sharePopup button { margin-right:5px; }
    #overlay {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.4); z-index:900;
    }
    #creator { margin-top:10px; font-size:14px; color:#333; }
    #creator a { text-decoration:none; color:#333; }
    #attribution {
      position:fixed; bottom:10px; right:10px; font-size:12px; color:#fff;
      background:rgba(0,0,0,0.5); padding:5px 8px; border-radius:3px; z-index:1001;
    }
  </style>
</head>
<body>
  <div id="topPanel">
    <div id="title">250mesh Guardian</div>
    <div id="instruction">
      人口が少ないメッシュをクリックしてください。人口の多い第３四分位数以上のメッシュを選択するとゲームオーバーです。
    </div>
    <div id="score">Score: 0</div>
    <div id="remaining">Remaining: 0</div>
    <button id="resetBtn">Reset</button>
    <button id="toggleBasemap">地図切替</button>
    <div id="creator">
      作成者：<a href="https://x.com/GISPHN" target="_blank">GISPHN</a><br>
      データ：行政区域(国土数値情報)、250mメッシュ(e-Stat2020年国勢調査)
    </div>
    <div id="gameMessage" style="margin-top:5px;font-weight:bold;color:red;"></div>
  </div>
  
  <div id="map"></div>
  <div id="overlay"></div>
  <div id="sharePopup">
    <div id="shareMessage" style="margin-bottom:10px;"></div>
    <button id="popupShareBtn">Share on X</button>
    <button id="popupCloseBtn">Close</button>
  </div>
  <div id="attribution">MapLibre | © OpenMapTiles © OpenStreetMap contributors</div>
  
  <script>
    // ベースマップ
    const baseMaps = [
      "https://tile.openstreetmap.jp/styles/osm-bright/style.json",
      {
        version: 8,
        sources: {
          "gsi-tiles": {
            type: "raster",
            tiles: ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"],
            tileSize: 256,
            attribution: "© <a href='https://www.gsi.go.jp/'>GSI</a>"
          }
        },
        layers: [{
          id: "gsi-tiles", type: "raster", source: "gsi-tiles", minzoom:0, maxzoom:18
        }]
      }
    ];
    let currentBasemapIndex = 0;
    
    // マップ初期化
    const map = new maplibregl.Map({
      container: 'map',
      style: baseMaps[currentBasemapIndex],
      center: [139.6917,35.6895],
      zoom: 10
    });
    
    // グローバルステート
    let municipalityData, meshData;
    let score=0, gameOver=false, q3Value=0, safeTotal=0, safeClickedCount=0;
    let municipalityMeshes, currentMunicipality;
    const clickedIds = new Set();
    
    // UI 更新
    function updateScoreDisplay(){ document.getElementById('score').innerText='Score: '+score; }
    function updateRemainingDisplay(){
      document.getElementById('remaining').innerText='Remaining: '+(safeTotal-safeClickedCount);
    }
    function celebrate(){
      const p=document.getElementById('topPanel');
      p.style.background="gold";
      setTimeout(()=>p.style.background="rgba(255,255,255,0.9)",1000);
    }
    function shareOnX(){
      let msg=document.getElementById('gameMessage').innerText||`250mesh Guardian: Score ${score}`;
      window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(msg+" #250meshGuardian"),"_blank");
    }
    function showSharePopup(msg){
      document.getElementById('shareMessage').innerText=msg;
      document.getElementById('overlay').style.display='block';
      document.getElementById('sharePopup').style.display='block';
    }
    function hideSharePopup(){
      document.getElementById('sharePopup').style.display='none';
      document.getElementById('overlay').style.display='none';
    }
    document.getElementById('popupShareBtn').addEventListener('click',shareOnX);
    document.getElementById('popupCloseBtn').addEventListener('click',hideSharePopup);
    
    // メッシュレイヤー追加（状態を保持）
    function addMeshLayer(){
      map.addSource('meshes',{ type:'geojson', data: municipalityMeshes });
      map.addLayer({
        id:'meshes-layer', type:'fill', source:'meshes',
        paint:{
          'fill-color':[
            'case',
            ['boolean',['feature-state','safeClicked'],false],
            'rgba(128,128,128,0)','rgba(128,128,128,0.5)'
          ],
          'fill-outline-color':'rgba(0,0,0,0.5)'
        }
      });
      // クリック済み状態を復元
      clickedIds.forEach(id=>{
        map.setFeatureState({ source:'meshes', id },{ safeClicked:true });
      });
      // イベント再バインド
      if(!gameOver) map.on('click','meshes-layer',handleMeshClick);
      map.on('mouseenter','meshes-layer',()=>map.getCanvas().style.cursor='pointer');
      map.on('mouseleave','meshes-layer',()=>map.getCanvas().style.cursor='');
    }
    
    // ゲーム開始／リセット
    function startGame(){
      // 既存レイヤー削除
      if(map.getLayer('meshes-layer')){
        map.off('click','meshes-layer',handleMeshClick);
        map.removeLayer('meshes-layer');
        map.removeSource('meshes');
      }
      // ステート初期化
      gameOver=false; score=0; safeClickedCount=0; clickedIds.clear();
      updateScoreDisplay(); document.getElementById('gameMessage').innerText="";
      hideSharePopup();
      // ランダム自治体選択
      const fts=municipalityData.features;
      currentMunicipality=fts[Math.floor(Math.random()*fts.length)];
      map.fitBounds(turf.bbox(currentMunicipality),{padding:20});
      // 自治体内メッシュ抽出
      const meshesIn = meshData.features.filter(f=>{
        return turf.booleanPointInPolygon(
          turf.centroid(f), currentMunicipality
        );
      });
      // Q3計算
      const pops=meshesIn.map(f=>f.properties["T001142001_人口（総数）"]).sort((a,b)=>a-b);
      q3Value = pops[Math.floor(0.75*pops.length)];
      safeTotal = meshesIn.filter(f=>f.properties["T001142001_人口（総数）"]<q3Value).length;
      updateRemainingDisplay();
      // GeoJSON 保存
      municipalityMeshes = { type:"FeatureCollection", features: meshesIn.map((f,i)=>{
        f.id = i; return f;
      })};
      // レイヤー追加
      addMeshLayer();
    }
    
    // メッシュクリック
    function handleMeshClick(e){
      if(gameOver||!e.features.length) return;
      const f=e.features[0], id=f.id;
      if(clickedIds.has(id)) return;
      const pop=f.properties["T001142001_人口（総数）"];
      if(pop>=q3Value){
        const rem=safeTotal-safeClickedCount;
        document.getElementById('gameMessage').innerText=`ゲームオーバー！第3四分位数以上のメッシュをクリックしました。残り：${rem}`;
        gameOver=true; map.off('click','meshes-layer',handleMeshClick);
        showSharePopup(document.getElementById('gameMessage').innerText);
      } else {
        clickedIds.add(id);
        map.setFeatureState({ source:'meshes', id },{ safeClicked:true });
        score++; safeClickedCount++;
        updateScoreDisplay(); updateRemainingDisplay();
        if(safeClickedCount>=safeTotal){
          document.getElementById('gameMessage').innerText='クリア!!';
          gameOver=true; map.off('click','meshes-layer',handleMeshClick);
          celebrate(); showSharePopup(document.getElementById('gameMessage').innerText);
        }
      }
    }
    
    // リセット
    document.getElementById('resetBtn').addEventListener('click',startGame);
    // ベースマップ切替（状態保持）
    document.getElementById('toggleBasemap').addEventListener('click',()=>{
      currentBasemapIndex = (currentBasemapIndex+1) % baseMaps.length;
      map.setStyle(baseMaps[currentBasemapIndex]);
      map.once('style.load', addMeshLayer);
    });
    
    // 初期ロード
    map.on('load',()=>{
      Promise.all([
        fetch('municipalities.geojson').then(r=>r.json()),
        fetch('pop_Osakacity_yodogawku.geojson').then(r=>r.json())
      ]).then(([mun,mesh])=>{
        municipalityData=mun; meshData=mesh;
        startGame();
      }).catch(console.error);
    });
  </script>
</body>
</html>
